name: base_bloc_3
description: A new base project using bloc, Clean Architecture on Flutter 3.

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ">=3.5.4 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  auto_route: ^9.2.2
  cached_network_image: ^3.4.1
  connectivity_plus: ^6.1.1
  copy_with_extension: ^6.0.0
  cupertino_icons: ^1.0.8
  dartz: ^0.10.1
  dio: ^5.7.0
  easy_localization: ^3.0.7
  equatable: ^2.0.7
  event_bus: ^2.0.0
  firebase_core: ^3.9.0
  firebase_core_platform_interface: ^5.4.0
  firebase_messaging: ^15.1.6
  flutter_bloc: ^8.1.6
  flutter_dotenv: ^5.1.0
  flutter_local_notifications: ^18.0.1
  flutter_screenutil: ^5.9.3
  flutter_smart_dialog: ^4.9.8+5
  flutter_svg: ^2.0.16
  freezed_annotation: ^2.4.4
  get_it: ^8.0.3
  infinite_scroll_pagination: ^4.1.0
  injectable: ^2.5.0
  json_annotation: ^4.9.0
  logger: ^2.5.0
  permission_handler: ^11.3.1
  retrofit: ^4.4.1
  shared_preferences: ^2.3.1
  sliver_tools: ^0.2.8
  talker: 4.5.2
  talker_dio_logger: 4.5.2
  talker_flutter: 4.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  auto_route_generator: ^9.0.0
  build_runner: ^2.3.3
  copy_with_extension_gen: ^6.0.0
  flutter_gen_runner: ^5.6.0
  flutter_lints: ^2.0.1
  freezed: ^2.2.0
  injectable_generator: ^2.4.2
  json_serializable: ^6.8.0
  retrofit_generator: ^9.1.5
flutter_gen:

  output: lib/gen/
  line_length: 80

  integrations:
    flutter_svg: true

  assets:
    enable: true

  font:
    enable: true


flutter:
  uses-material-design: true
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/roboto/Roboto-Italic.ttf
          style: italic
        - asset: assets/fonts/roboto/Roboto-Light.ttf
          weight: 100
        - asset: assets/fonts/roboto/Roboto-Light.ttf
          weight: 200
        - asset: assets/fonts/roboto/Roboto-Light.ttf
          weight: 300
        - asset: assets/fonts/roboto/Roboto-Regular.ttf
          weight: 400
        - asset: assets/fonts/roboto/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/roboto/Roboto-Medium.ttf
          weight: 600
        - asset: assets/fonts/roboto/Roboto-Bold.ttf
          weight: 700
        - asset: assets/fonts/roboto/Roboto-Bold.ttf
          weight: 800
        - asset: assets/fonts/roboto/Roboto-Bold.ttf
          weight: 900
    - family: RobotoCondensed
      fonts:
        - asset: assets/fonts/roboto_condensed/RobotoCondensed-Light.ttf
          weight: 100
        - asset: assets/fonts/roboto_condensed/RobotoCondensed-Light.ttf
          weight: 200
        - asset: assets/fonts/roboto_condensed/RobotoCondensed-Light.ttf
          weight: 300
        - asset: assets/fonts/roboto_condensed/RobotoCondensed-Regular.ttf
          weight: 400
        - asset: assets/fonts/roboto_condensed/RobotoCondensed-Regular.ttf
          weight: 500
        - asset: assets/fonts/roboto_condensed/RobotoCondensed-Regular.ttf
          weight: 600
        - asset: assets/fonts/roboto_condensed/RobotoCondensed-Bold.ttf
          weight: 700
        - asset: assets/fonts/roboto_condensed/RobotoCondensed-Bold.ttf
          weight: 800
        - asset: assets/fonts/roboto_condensed/RobotoCondensed-Bold.ttf
          weight: 900

        - asset: assets/fonts/roboto_condensed/RobotoCondensed-Italic.ttf
          style: italic
  assets:
    - assets/env/
    - assets/images/
    - assets/svg/