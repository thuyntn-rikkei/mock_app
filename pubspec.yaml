name: base_bloc_3
description: A new base project using bloc, Clean Architecture on Flutter 3.

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ">=2.17.1 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  analyzer: ^5.11.1
  animated_text_kit: ^4.2.2
  app_settings: 4.1.8
  appcheck: ^1.0.6
  async: ^2.10.0
  auto_route: ^6.0.4
  auto_size_text: ^3.0.0
  cached_network_image: ^3.2.1
  carousel_slider: ^4.1.1
  connectivity_plus: ^3.0.2
  copy_with_extension: ^5.0.2
  crypto: ^3.0.2
  cupertino_icons: ^1.0.2
  dartz: ^0.10.1
  device_preview: ^1.1.0
  diacritic: ^0.1.3
  dio: ^5.1.1
  easy_localization: ^3.0.1
  equatable: ^2.0.3
  event_bus: ^2.0.0
  expandable: ^5.0.1
  firebase_core: 2.1.1
  firebase_core_platform_interface: 4.6.0
  firebase_dynamic_links: 5.0.4
  firebase_messaging: 14.0.3
  flutter_app_badger: ^1.5.0
  flutter_bloc: ^8.0.1
  flutter_cache_manager: ^3.3.0
  flutter_dotenv: ^5.0.2
  flutter_local_notifications: ^13.0.0
  flutter_screenutil: ^5.5.3+2
  flutter_smart_dialog: ^4.7.1
  flutter_svg: ^2.0.5
  flutter_widget_from_html: 0.10.0
  freezed_annotation: ^2.2.0
  get_it: ^7.2.0
  infinite_scroll_pagination: ^3.2.0
  injectable: ^2.1.1
  json_annotation: ^4.7.0
  logger: ^1.1.0
  permission_handler: ^10.2.0
  retrofit: ^4.0.1
  shared_preferences: ^2.0.15
  shimmer: ^2.0.0
  sliver_tools: ^0.2.8
  stream_transform: ^2.1.0
  photo_view: ^0.14.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.1
  freezed: ^2.2.0
  injectable_generator: ^2.1.5
  build_runner: ^2.3.2
  json_serializable: ^6.5.4
  retrofit_generator: ^6.0.0+3
  auto_route_generator: ^6.0.2
  copy_with_extension_gen: ^5.0.2
  flutter_gen_runner: 5.3.0
flutter_gen:

  output: lib/gen/
  line_length: 80

  integrations:
    flutter_svg: true

  assets:
    enable: true

  font:
    enable: true


flutter:
  uses-material-design: true
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/roboto/Roboto-Italic.ttf
          style: italic
        - asset: assets/fonts/roboto/Roboto-Light.ttf
          weight: 100
        - asset: assets/fonts/roboto/Roboto-Light.ttf
          weight: 200
        - asset: assets/fonts/roboto/Roboto-Light.ttf
          weight: 300
        - asset: assets/fonts/roboto/Roboto-Regular.ttf
          weight: 400
        - asset: assets/fonts/roboto/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/roboto/Roboto-Medium.ttf
          weight: 600
        - asset: assets/fonts/roboto/Roboto-Bold.ttf
          weight: 700
        - asset: assets/fonts/roboto/Roboto-Bold.ttf
          weight: 800
        - asset: assets/fonts/roboto/Roboto-Bold.ttf
          weight: 900
    - family: RobotoCondensed
      fonts:
        - asset: assets/fonts/roboto_condensed/RobotoCondensed-Light.ttf
          weight: 100
        - asset: assets/fonts/roboto_condensed/RobotoCondensed-Light.ttf
          weight: 200
        - asset: assets/fonts/roboto_condensed/RobotoCondensed-Light.ttf
          weight: 300
        - asset: assets/fonts/roboto_condensed/RobotoCondensed-Regular.ttf
          weight: 400
        - asset: assets/fonts/roboto_condensed/RobotoCondensed-Regular.ttf
          weight: 500
        - asset: assets/fonts/roboto_condensed/RobotoCondensed-Regular.ttf
          weight: 600
        - asset: assets/fonts/roboto_condensed/RobotoCondensed-Bold.ttf
          weight: 700
        - asset: assets/fonts/roboto_condensed/RobotoCondensed-Bold.ttf
          weight: 800
        - asset: assets/fonts/roboto_condensed/RobotoCondensed-Bold.ttf
          weight: 900

        - asset: assets/fonts/roboto_condensed/RobotoCondensed-Italic.ttf
          style: italic
  assets:
    - assets/env/
    - assets/images/
    - assets/svg/